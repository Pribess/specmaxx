# Build and deploy the static app as a Cloudflare Worker with static assets, served at cro.sh/specmaxx/. Release by
# force-pushing the tag `release-pages` to the commit to publish (see docs/deploy.md).
name: Deploy to Cloudflare Workers

on:
  push:
    tags: ['release-pages']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vitest, Vite and the other tool CLIs run on Node (their `#!/usr/bin/env node` shebang), not on Bun: pin the
      # same Node as local work (.node-version) instead of the runner image's default, whose V8 rounds Math.pow / exp /
      # log differently in the last bits.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # The Playwright e2e step of `bun run check` is skipped here: installing Chromium costs more than the rest of
      # the job, and e2e already runs locally in `bun run check` before every change lands.
      - run: bun run build
      - run: bun run deploy:assets

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          # Keep in sync with the wrangler devDependency in package.json.
          wranglerVersion: '4.158.0'
          packageManager: bun
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
